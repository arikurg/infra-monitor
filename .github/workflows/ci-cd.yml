name: ci-cd

# Pipeline:
#   validate (GitHub-hosted) → build+push to GHCR (GitHub-hosted) →
#   deploy (Option A: self-hosted runner on the kind machine, gated to main pushes)
#
# SECURITY (public repo): the `deploy` job runs on a self-hosted runner — your
# own machine. To stop a fork's PR from executing code there, it is gated to
# `push` events on `main` only (never pull_request). Also keep repo Settings →
# Actions → "Require approval for all external contributors" enabled.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/infra-learning

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # kubeconform validates manifests against the Kubernetes JSON schemas
      # offline. (kubectl --dry-run=client can't be used here: it downloads the
      # OpenAPI schema from a live cluster API, which a CI runner doesn't have.)
      - name: Validate Kubernetes manifests (offline)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar -xz
          ./kubeconform -strict -summary k8s/

  build:
    runs-on: ubuntu-latest
    needs: validate
    # Only push on a real push to main; PRs build but don't push.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        tier: [app, web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.tier }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.tier }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.tier }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.tier }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Self-hosted runner on the machine that hosts the kind cluster.
    # Register it with the label `kind` (see README).
    runs-on: [self-hosted, kind]
    needs: build
    # Gate: only direct pushes to main. Fork PRs (pull_request events) never
    # reach this job, so untrusted code can't run on the self-hosted machine.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    env:
      # Use a job-local docker config so `docker login` writes plaintext creds
      # here instead of the macOS keychain. The launchd-managed runner is
      # headless and can't unlock the keychain ("User interaction is not
      # allowed. (-25308)"), which fails the login otherwise.
      DOCKER_CONFIG: ${{ github.workspace }}/.docker-config
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: |
          # Write a config with credsStore disabled so docker stores the token
          # as plaintext base64 here, not via the macOS keychain helper (which
          # a headless launchd runner can't unlock → error -25308).
          mkdir -p "$DOCKER_CONFIG"
          echo '{"auths":{},"credsStore":""}' > "$DOCKER_CONFIG/config.json"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull images, load into kind, and roll out (tag = commit SHA)
        env:
          TAG: ${{ github.sha }}
          # Make targets read GHCR_OWNER; pass the real repo owner so the
          # image names match what `build` pushed (works for forks too).
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          docker pull ${{ env.IMAGE_PREFIX }}-app:$TAG
          docker pull ${{ env.IMAGE_PREFIX }}-web:$TAG
          # kube context must point at the kind cluster on this machine
          kubectl config use-context kind-infra-learning
          make kind-load  TAG="$TAG"   # load the pulled images into kind nodes
          make k8s-deploy TAG="$TAG"   # apply manifests, set image to this SHA, wait for rollout
