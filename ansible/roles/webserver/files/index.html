<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infrastructure Status</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:  #1D9E75;
      --green-bg: #E1F5EE;
      --red:    #A32D2D;
      --red-bg: #FCEBEB;
      --amber:  #854F0B;
      --amber-bg: #FAEEDA;
      --gray:   #5F5E5A;
      --gray-bg: #F1EFE8;
      --border: rgba(0,0,0,0.08);
      --text:   #2C2C2A;
      --muted:  #5F5E5A;
      --bg:     #F8F7F4;
      --card:   #FFFFFF;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --green:    #5DCAA5;
        --green-bg: #04342C;
        --red:      #F09595;
        --red-bg:   #501313;
        --amber:    #EF9F27;
        --amber-bg: #412402;
        --gray:     #B4B2A9;
        --gray-bg:  #2C2C2A;
        --border:   rgba(255,255,255,0.08);
        --text:     #E8E6E0;
        --muted:    #888780;
        --bg:       #1A1A18;
        --card:     #242422;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 48px 24px;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
    }

    /* ── Header ── */
    .header {
      margin-bottom: 40px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .overall-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .overall-badge.healthy  { background: var(--green-bg);  color: var(--green); }
    .overall-badge.degraded { background: var(--red-bg);    color: var(--red);   }
    .overall-badge.loading  { background: var(--gray-bg);   color: var(--gray);  }

    .last-checked {
      font-size: 13px;
      color: var(--muted);
    }

    /* ── Cards ── */
    .services {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 32px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      gap: 4px 16px;
      align-items: start;
    }

    .card-left  { display: flex; flex-direction: column; gap: 4px; }
    .card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

    .service-name {
      font-size: 15px;
      font-weight: 600;
    }

    .service-tier {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .service-detail {
      font-size: 13px;
      color: var(--muted);
      font-family: 'SF Mono', 'Fira Code', monospace;
      grid-column: 1;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
    }
    .status-dot.healthy  { background: var(--green); box-shadow: 0 0 0 3px var(--green-bg); }
    .status-dot.degraded { background: var(--red);   box-shadow: 0 0 0 3px var(--red-bg);   }
    .status-dot.loading  { background: var(--gray);  box-shadow: 0 0 0 3px var(--gray-bg);  }

    .latency {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .latency.fast   { color: var(--green); }
    .latency.medium { color: var(--amber); }
    .latency.slow   { color: var(--red);   }

    /* ── Footer / polling indicator ── */
    .footer {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1;   transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.8); }
    }

    .countdown {
      font-variant-numeric: tabular-nums;
    }

    /* ── Error state ── */
    .error-banner {
      background: var(--red-bg);
      border: 1px solid var(--red);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--red);
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-top">
      <h1>Infrastructure Status</h1>
      <span class="overall-badge loading" id="overall-badge">Checking…</span>
    </div>
    <p class="last-checked" id="last-checked">Fetching status…</p>
  </div>

  <div class="error-banner" id="error-banner"></div>

  <div class="services" id="services">
    <!-- Skeleton cards while loading -->
    <div class="card" id="skel-1">
      <div class="card-left">
        <span class="service-name" style="color:var(--muted)">Nginx</span>
        <span class="service-tier">web</span>
      </div>
      <div class="card-right">
        <span class="status-dot loading"></span>
        <span class="latency">—</span>
      </div>
      <span class="service-detail">waiting…</span>
    </div>
    <div class="card" id="skel-2">
      <div class="card-left">
        <span class="service-name" style="color:var(--muted)">Node.js</span>
        <span class="service-tier">app</span>
      </div>
      <div class="card-right">
        <span class="status-dot loading"></span>
        <span class="latency">—</span>
      </div>
      <span class="service-detail">waiting…</span>
    </div>
    <div class="card" id="skel-3">
      <div class="card-left">
        <span class="service-name" style="color:var(--muted)">PostgreSQL</span>
        <span class="service-tier">db</span>
      </div>
      <div class="card-right">
        <span class="status-dot loading"></span>
        <span class="latency">—</span>
      </div>
      <span class="service-detail">waiting…</span>
    </div>
  </div>

  <div class="footer">
    <div class="pulse" id="pulse-dot"></div>
    <span>Refreshing in <span class="countdown" id="countdown">10</span>s</span>
  </div>

</div>

<script>
  const POLL_INTERVAL = 10000;  // ms between checks
  let countdown = POLL_INTERVAL / 1000;
  let timer;

  function latencyClass(ms) {
    if (ms <  50) return 'fast';
    if (ms < 200) return 'medium';
    return 'slow';
  }

  function fmtLatency(ms) {
    return ms === 0 ? '—' : `${ms}ms`;
  }

  function fmtTime(iso) {
    const d = new Date(iso);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function renderServices(services) {
    const container = document.getElementById('services');
    container.innerHTML = '';

    services.forEach(svc => {
      const state  = svc.ok ? 'healthy' : 'degraded';
      const latCls = svc.ok ? latencyClass(svc.latencyMs) : '';

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-left">
          <span class="service-name">${svc.name}</span>
          <span class="service-tier">${svc.tier} tier</span>
        </div>
        <div class="card-right">
          <span class="status-dot ${state}"></span>
          <span class="latency ${latCls}">${svc.ok ? fmtLatency(svc.latencyMs) : 'down'}</span>
        </div>
        <span class="service-detail">${svc.detail || (svc.error || '')}</span>
      `;
      container.appendChild(card);
    });
  }

  async function fetchStatus() {
    const badge   = document.getElementById('overall-badge');
    const checked = document.getElementById('last-checked');
    const errBanner = document.getElementById('error-banner');

    try {
      const res  = await fetch('/api/status');
      const data = await res.json();

      errBanner.style.display = 'none';

      badge.textContent = data.overall === 'healthy' ? 'All systems operational' : 'Degraded';
      badge.className   = `overall-badge ${data.overall}`;
      checked.textContent = `Last checked at ${fmtTime(data.checkedAt)}`;

      renderServices(data.services);

    } catch (err) {
      errBanner.textContent = `Could not reach the status API: ${err.message}`;
      errBanner.style.display = 'block';
      badge.textContent = 'Unknown';
      badge.className   = 'overall-badge loading';
    }
  }

  function startCountdown() {
    clearInterval(timer);
    countdown = POLL_INTERVAL / 1000;
    document.getElementById('countdown').textContent = countdown;

    timer = setInterval(() => {
      countdown -= 1;
      document.getElementById('countdown').textContent = countdown;
      if (countdown <= 0) {
        clearInterval(timer);
        fetchStatus().then(startCountdown);
      }
    }, 1000);
  }

  // Initial load
  fetchStatus().then(startCountdown);
</script>
</body>
</html>
